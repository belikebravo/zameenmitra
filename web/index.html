<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZameenMitra Web Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 flex flex-col items-center py-12">

    <div class="max-w-xl w-full bg-white shadow-xl rounded-2xl p-8 border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-700 mb-2">ZameenMitra Vault</h1>
            <p class="text-gray-500">Securely upload and verify your property documents.</p>
        </div>

        <div class="border-2 border-dashed border-indigo-200 rounded-xl p-8 text-center bg-indigo-50/50 hover:bg-indigo-50 transition cursor-pointer mb-6" id="dropzone" onclick="document.getElementById('fileInput').click()">
            <svg class="mx-auto h-12 w-12 text-indigo-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
            </svg>
            <p class="text-sm text-gray-600 font-medium">Click to select or drag and drop</p>
            <p class="text-xs text-gray-400 mt-1">PDF, JPG, PNG up to 10MB</p>
            <input type="file" id="fileInput" class="hidden" />
        </div>

        <div id="fileInfo" class="hidden mb-6 flex items-center justify-between bg-gray-50 p-3 rounded-lg border border-gray-200">
            <div class="flex items-center">
                <svg class="h-6 w-6 text-indigo-500 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <span id="fileName" class="text-sm font-medium text-gray-700 truncate max-w-[200px]"></span>
            </div>
            <button onclick="removeFile()" class="text-red-500 hover:text-red-700 text-sm font-medium">Remove</button>
        </div>

        <button id="uploadBtn" disabled onclick="uploadFile()" class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-semibold py-3 px-4 rounded-xl transition duration-200 flex items-center justify-center">
            Upload to Vault
        </button>

        <div id="statusMessage" class="mt-6 hidden p-4 rounded-lg text-sm font-medium"></div>
        <div id="verificationDetails" class="mt-4 hidden p-4 bg-gray-50 border border-gray-200 rounded-lg text-sm">
            <h3 class="font-bold text-indigo-700 mb-2 border-b pb-1">Verification Report</h3>
            <p><strong>Status:</strong> <span id="vStatus"></span></p>
            <p><strong>Extracted Survey No:</strong> <span id="vSurvey"></span></p>
            <p><strong>Verified Owner:</strong> <span id="vOwner"></span></p>
            <p><strong>Encumbrances:</strong> <span id="vEncumbrance" class="font-semibold text-red-600"></span></p>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileNameDisplay = document.getElementById('fileName');
        const uploadBtn = document.getElementById('uploadBtn');
        const statusMessage = document.getElementById('statusMessage');
        let selectedFile = null;

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileNameDisplay.textContent = selectedFile.name;
                fileInfo.classList.remove('hidden');
                uploadBtn.disabled = false;
                hideStatus();
            }
        });

        function removeFile() {
            selectedFile = null;
            fileInput.value = '';
            fileInfo.classList.add('hidden');
            uploadBtn.disabled = true;
        }

        function showStatus(message, isError = false) {
            statusMessage.classList.remove('hidden', 'bg-green-50', 'text-green-700', 'bg-red-50', 'text-red-700');
            statusMessage.classList.add(isError ? 'bg-red-50' : 'bg-green-50', isError ? 'text-red-700' : 'text-green-700');
            statusMessage.textContent = message;
        }

        function hideStatus() {
            statusMessage.classList.add('hidden');
            document.getElementById('verificationDetails').classList.add('hidden');
        }

        async function uploadFile() {
            if (!selectedFile) return;

            uploadBtn.disabled = true;
            uploadBtn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Processing...`;

            const formData = new FormData();
            formData.append('document', selectedFile);

            try {
                // Ensure Go backend is running on 8080
                const response = await fetch('http://localhost:8080/api/v1/vault/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                if (response.ok) {
                    showStatus(`Success! Server says: ${data.message} (Doc ID: ${data.document_id})`);
                    
                    if (data.extracted_record || data.validation_result) {
                        document.getElementById('verificationDetails').classList.remove('hidden');
                        document.getElementById('vStatus').textContent = data.status || 'N/A';
                        document.getElementById('vSurvey').textContent = data.extracted_record?.survey_number || 'N/A';
                        document.getElementById('vOwner').textContent = data.validation_result?.registered_owner || 'N/A';
                        document.getElementById('vEncumbrance').textContent = data.validation_result?.encumbrance_status || 'N/A';
                    }
                } else {
                    showStatus(`Error: ${data.message || 'Upload failed'}`, true);
                }
            } catch (error) {
                console.error(error);
                showStatus('Network Error: Could not reach the Vault Backend. Is it running?', true);
            } finally {
                uploadBtn.textContent = 'Upload to Vault';
                uploadBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
